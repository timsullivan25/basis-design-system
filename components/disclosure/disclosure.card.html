<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:7px}
.grid{display:grid;gap:16px 26px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Accordion, Popover, DeltaValue, IconButton, Button, DataTable, BarMeter } = window.BasisDesignSystem_6e7350;
function Demo(){
  const [open,setOpen]=React.useState(['quant']);
  const toggle=k=>setOpen(o=>o.includes(k)?o.filter(x=>x!==k):[...o,k]);
  const sum=(w,d)=>(<><span style={{fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums'}}>{w}% NAV</span><DeltaValue value={d} size="xs" /></>);
  return (
    <div className="col">
      <div className="row" style={{justifyContent:'space-between'}}>
        <span style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>Strategy → sleeve → position. Collapsed rows still carry the numbers.</span>
        <Popover title="How this is calculated" trigger={<Button size="xs" iconLeft="info">Method</Button>}>
          Contribution is arithmetic, gross of financing, attributed to the sleeve holding the position at T-1 close.
        </Popover>
      </div>
      <Accordion openKeys={open} onToggle={toggle} items={[
        {key:'quant',label:'Quant',icon:'cpu',summary:sum(38.2,0.84),content:(
          <div className="col" style={{gap:8}}>
            {[['Stat arb',14.1,72],['Momentum',12.6,58],['Vol carry',11.5,44]].map(([l,w,u])=>(
              <div key={l} className="row" style={{gap:12,fontSize:'var(--text-xs)'}}>
                <span style={{width:110,color:'var(--text-body)'}}>{l}</span>
                <span style={{width:70,fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',color:'var(--text-secondary)'}}>{w}% NAV</span>
                <BarMeter value={u} limit={80} showValue style={{maxWidth:220}} />
              </div>
            ))}
          </div>)},
        {key:'fund',label:'Fundamental',icon:'search',summary:sum(31.4,-0.22),content:<span style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>6 sleeves · 84 names · avg holding period 11 months.</span>},
        {key:'macro',label:'Macro',icon:'globe',summary:sum(19.0,0.31),content:<span style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>Rates, FX and commodity overlays.</span>},
      ]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
