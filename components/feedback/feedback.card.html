<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:7px}
.grid{display:grid;gap:16px 26px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Alert, Toast, Tooltip, Dialog, Button, Icon, IconButton } = window.BasisDesignSystem_6e7350;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (
    <div className="col">
      <Alert tone="caution" compact title="Prices delayed 15 minutes" actions={<Button variant="link" size="xs">Reconnect</Button>} onDismiss={()=>{}} />
      <Alert tone="negative" title="Gross exposure limit breached" actions={<Button size="sm" iconLeft="eye">Review</Button>}>
        Global L/S is at 182% gross against a 175% mandate limit. Breach opened at 14:32 ET.
      </Alert>
      <Alert tone="info" compact title="Attribution recalculated on the T+1 book" />
      <div className="row" style={{alignItems:'flex-start',gap:18}}>
        <Toast tone="positive" title="Screen saved" onDismiss={()=>{}} action={<Button variant="link" size="xs">Open</Button>}>42 names matched your criteria.</Toast>
        <div className="col" style={{gap:12}}>
          <div>
            <div className="lbl">Tooltip</div>
            <div className="row" style={{gap:8,fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>
              Beta-adjusted net
              <Tooltip content="60-day rolling regression against the primary benchmark."><Icon name="info" size={12} color="var(--text-tertiary)" /></Tooltip>
            </div>
          </div>
          <div>
            <div className="lbl">Dialog</div>
            <Button variant="primary" size="sm" iconLeft="plus" onClick={()=>setOpen(true)}>New screen</Button>
          </div>
        </div>
      </div>
      <Dialog open={open} onClose={()=>setOpen(false)} title="New screen" icon="filter" subtitle="Saved to your workspace"
        footer={<><Button size="sm" onClick={()=>setOpen(false)}>Cancel</Button><Button size="sm" variant="primary" onClick={()=>setOpen(false)}>Create</Button></>}>
        <div style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>Screens combine factor, valuation and liquidity criteria. You can extend one per strategy later.</div>
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
