<!-- @dsCard group="Colors" viewport="700x160" name="Dark mode surfaces" subtitle="Set data-theme=\"dark\" — same tokens, remapped" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div data-theme="dark" style="display:flex;gap:10px;padding:12px;background:var(--surface-app);border-radius:var(--radius-md)">
<div class="sw"><div style="height:40px;background:var(--surface-app);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="nm" style="color:var(--text-tertiary)">App</div></div><div class="sw"><div style="height:40px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="nm" style="color:var(--text-tertiary)">Card</div></div><div class="sw"><div style="height:40px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="nm" style="color:var(--text-tertiary)">Raised</div></div><div class="sw"><div style="height:40px;background:var(--surface-sunken);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="nm" style="color:var(--text-tertiary)">Sunken</div></div><div class="sw"><div style="height:40px;background:var(--surface-selected);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="nm" style="color:var(--text-tertiary)">Selected</div></div>
<div class="sw" style="flex:0 0 auto;justify-content:center;padding-left:8px">
<span style="font-family:var(--font-mono);font-size:15px;color:var(--value-up)">+1.84%</span>
<span style="font-family:var(--font-mono);font-size:15px;color:var(--value-down)">−0.91%</span>
<span style="font-size:11px;color:var(--text-secondary)">Body / secondary</span></div></div>
</body></html>
