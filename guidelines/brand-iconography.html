<!-- @dsCard group="Brand" viewport="700x150" name="Iconography" subtitle="Lucide, 2px stroke, 12–16px, always beside a label" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap;align-items:center}.c{display:flex;flex-direction:column}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}</style>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script></head><body>
<div class="c" style="gap:13px">
<div class="r" style="gap:15px"><i data-lucide="layout-dashboard" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="table-2" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="gauge" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="filter" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="line-chart" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="pie-chart" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="scale" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="trending-up" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="trending-down" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="alert-triangle" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="info" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="download" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="settings-2" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="search" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="cpu" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="briefcase" style="width:16px;height:16px;color:var(--text-secondary)"></i><i data-lucide="file-text" style="width:16px;height:16px;color:var(--text-secondary)"></i></div>
<div class="r" style="gap:24px">
<span class="r" style="gap:6px;font-size:12px"><i data-lucide="trending-up" style="width:12px;height:12px;color:var(--text-brand)"></i>12px · table cell</span>
<span class="r" style="gap:6px;font-size:12px"><i data-lucide="trending-up" style="width:14px;height:14px;color:var(--text-brand)"></i>14px · control</span>
<span class="r" style="gap:6px;font-size:12px"><i data-lucide="trending-up" style="width:16px;height:16px;color:var(--text-brand)"></i>16px · nav</span>
</div>
<span class="nm">Substitution: no icon set was supplied. Lucide 0.469 via CDN, 2px stroke — see ICONOGRAPHY in readme.md.</span>
</div>
<script>lucide.createIcons({attrs:{'stroke-width':2}});</script>
</body></html>
