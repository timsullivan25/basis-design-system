<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:6px"><div class="sw"><div class="chip" style="height:42px;background:var(--chart-1)"></div><div class="nm">1</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-2)"></div><div class="nm">2</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-3)"></div><div class="nm">3</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-4)"></div><div class="nm">4</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-5)"></div><div class="nm">5</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-6)"></div><div class="nm">6</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-7)"></div><div class="nm">7</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-8)"></div><div class="nm">8</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-9)"></div><div class="nm">9</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-10)"></div><div class="nm">10</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-11)"></div><div class="nm">11</div></div><div class="sw"><div class="chip" style="height:42px;background:var(--chart-12)"></div><div class="nm">12</div></div></div>
</body></html>
