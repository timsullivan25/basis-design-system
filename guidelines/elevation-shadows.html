<!-- @dsCard group="Elevation" viewport="700x150" name="Shadow scale" subtitle="Flat in page. 1 for controls, 3 for popovers, 4 for modals" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:18px;align-items:flex-end">
<div class="c" style="gap:6px;align-items:center"><div style="width:96px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-none)"></div><span class="vl">--shadow-none</span><span class="vl" style="color:var(--text-tertiary)">In-page cards</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:96px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-1)"></div><span class="vl">--shadow-1</span><span class="vl" style="color:var(--text-tertiary)">Controls</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:96px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-2)"></div><span class="vl">--shadow-2</span><span class="vl" style="color:var(--text-tertiary)">Hover lift</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:96px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-3)"></div><span class="vl">--shadow-3</span><span class="vl" style="color:var(--text-tertiary)">Popover</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:96px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-4)"></div><span class="vl">--shadow-4</span><span class="vl" style="color:var(--text-tertiary)">Dialog</span></div>
</div>
</body></html>
