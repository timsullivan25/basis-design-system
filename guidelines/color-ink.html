<!-- @dsCard group="Colors" viewport="700x125" name="Ink neutrals" subtitle="Cool near-black ramp — text, borders, surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:6px"><div class="sw"><div class="chip" style="height:46px;background:var(--ink-25)"></div><div class="nm">25</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-50)"></div><div class="nm">50</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-100)"></div><div class="nm">100</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-150)"></div><div class="nm">150</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-200)"></div><div class="nm">200</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-300)"></div><div class="nm">300</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-400)"></div><div class="nm">400</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-500)"></div><div class="nm">500</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-600)"></div><div class="nm">600</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-700)"></div><div class="nm">700</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-800)"></div><div class="nm">800</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-900)"></div><div class="nm">900</div></div><div class="sw"><div class="chip" style="height:46px;background:var(--ink-950)"></div><div class="nm">950</div></div></div>
</body></html>
