<!-- @dsCard group="Type" viewport="700x140" name="Micro-caps labels" subtitle="11px semibold, 0.07em tracking — every field and column header" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="c" style="gap:12px">
<div style="display:flex;gap:28px">
<div class="c" style="gap:5px"><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)">Net exposure</span><span style="font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-primary)">42.8%</span></div><div class="c" style="gap:5px"><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)">MTD return</span><span style="font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-primary)">+2.41%</span></div><div class="c" style="gap:5px"><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)">Sharpe (3y)</span><span style="font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-primary)">1.62</span></div><div class="c" style="gap:5px"><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)">Turnover</span><span style="font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-primary)">38%</span></div>
</div>
<div class="nm">--text-2xs / --weight-semibold / --tracking-caps · never sentence-case a label</div></div>
</body></html>
