<!-- @dsCard group="Elevation" viewport="700x150" name="Borders &amp; focus" subtitle="Hairlines carry structure; the focus ring is blue at 20%" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:16px;align-items:flex-end">
<div class="c" style="gap:6px;align-items:center"><div style="width:110px;height:48px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md)"></div><span class="vl">--border-subtle</span><span class="vl" style="color:var(--text-tertiary)">Row dividers</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:110px;height:48px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><span class="vl">--border-default</span><span class="vl" style="color:var(--text-tertiary)">Cards, fields</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:110px;height:48px;background:var(--surface-card);border:1px solid var(--border-strong-c);border-radius:var(--radius-md)"></div><span class="vl">--border-strong-c</span><span class="vl" style="color:var(--text-tertiary)">Emphasis</span></div>
<div class="c" style="gap:6px;align-items:center"><div style="display:flex;align-items:center;width:150px;height:28px;padding:0 10px;background:var(--field-bg);border:1px solid var(--border-focus);border-radius:var(--radius-md);box-shadow:var(--focus-ring);font-size:13px;color:var(--text-primary)">Focused field</div><span class="vl">--focus-ring</span></div>
</div>
</body></html>
