<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Positive, negative, caution, info — background / border / foreground" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:10px"><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-positive-bg);border:1px solid var(--status-positive-border);border-radius:var(--radius-sm);font-size:11px;font-weight:600;color:var(--status-positive-fg)">Positive</div><div class="nm">--status-positive-*</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-negative-bg);border:1px solid var(--status-negative-border);border-radius:var(--radius-sm);font-size:11px;font-weight:600;color:var(--status-negative-fg)">Negative</div><div class="nm">--status-negative-*</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-caution-bg);border:1px solid var(--status-caution-border);border-radius:var(--radius-sm);font-size:11px;font-weight:600;color:var(--status-caution-fg)">Caution</div><div class="nm">--status-caution-*</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-info-bg);border:1px solid var(--status-info-border);border-radius:var(--radius-sm);font-size:11px;font-weight:600;color:var(--status-info-fg)">Info</div><div class="nm">--status-info-*</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-neutral-bg);border:1px solid var(--status-neutral-border);border-radius:var(--radius-sm);font-size:11px;font-weight:600;color:var(--status-neutral-fg)">Neutral</div><div class="nm">--status-neutral-*</div></div></div>
</body></html>
