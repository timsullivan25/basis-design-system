<!-- @dsCard group="Spacing" viewport="700x140" name="Control heights" subtitle="20 / 24 / 28 / 34 / 40 — 28px is default, 24px in dense chrome" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:12px;align-items:flex-end">
<div class="c" style="gap:6px;align-items:center"><div style="display:flex;align-items:center;justify-content:center;height:20px;padding:0 12px;background:var(--action-secondary-bg);border:1px solid var(--action-secondary-border);border-radius:var(--radius-md);box-shadow:var(--shadow-1);font-size:11px;font-weight:500;color:var(--text-body)">Button</div><span class="vl">20px</span><span class="vl" style="color:var(--text-tertiary)">--control-xs</span></div><div class="c" style="gap:6px;align-items:center"><div style="display:flex;align-items:center;justify-content:center;height:24px;padding:0 12px;background:var(--action-secondary-bg);border:1px solid var(--action-secondary-border);border-radius:var(--radius-md);box-shadow:var(--shadow-1);font-size:13px;font-weight:500;color:var(--text-body)">Button</div><span class="vl">24px</span><span class="vl" style="color:var(--text-tertiary)">--control-sm</span></div><div class="c" style="gap:6px;align-items:center"><div style="display:flex;align-items:center;justify-content:center;height:28px;padding:0 12px;background:var(--action-secondary-bg);border:1px solid var(--action-secondary-border);border-radius:var(--radius-md);box-shadow:var(--shadow-1);font-size:13px;font-weight:500;color:var(--text-body)">Button</div><span class="vl">28px</span><span class="vl" style="color:var(--text-tertiary)">--control-md</span></div><div class="c" style="gap:6px;align-items:center"><div style="display:flex;align-items:center;justify-content:center;height:34px;padding:0 12px;background:var(--action-secondary-bg);border:1px solid var(--action-secondary-border);border-radius:var(--radius-md);box-shadow:var(--shadow-1);font-size:13px;font-weight:500;color:var(--text-body)">Button</div><span class="vl">34px</span><span class="vl" style="color:var(--text-tertiary)">--control-lg</span></div><div class="c" style="gap:6px;align-items:center"><div style="display:flex;align-items:center;justify-content:center;height:40px;padding:0 12px;background:var(--action-secondary-bg);border:1px solid var(--action-secondary-border);border-radius:var(--radius-md);box-shadow:var(--shadow-1);font-size:13px;font-weight:500;color:var(--text-body)">Button</div><span class="vl">40px</span><span class="vl" style="color:var(--text-tertiary)">--control-xl</span></div>
</div>
</body></html>
