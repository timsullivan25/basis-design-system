<!-- @dsCard group="Motion" viewport="700x150" name="Duration &amp; easing" subtitle="80–260ms. Fast, decelerating, never bouncy except toggles" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="c" style="gap:12px">
<div class="r" style="gap:22px">
<div class="c" style="gap:3px"><span style="font-family:var(--font-mono);font-size:14px;color:var(--text-primary)">80ms</span><span class="vl">--dur-instant</span><span class="vl" style="color:var(--text-tertiary)">Hover, press</span></div><div class="c" style="gap:3px"><span style="font-family:var(--font-mono);font-size:14px;color:var(--text-primary)">120ms</span><span class="vl">--dur-fast</span><span class="vl" style="color:var(--text-tertiary)">Color, focus</span></div><div class="c" style="gap:3px"><span style="font-family:var(--font-mono);font-size:14px;color:var(--text-primary)">180ms</span><span class="vl">--dur-base</span><span class="vl" style="color:var(--text-tertiary)">Expand, reveal</span></div><div class="c" style="gap:3px"><span style="font-family:var(--font-mono);font-size:14px;color:var(--text-primary)">260ms</span><span class="vl">--dur-slow</span><span class="vl" style="color:var(--text-tertiary)">Chart draw</span></div><div class="c" style="gap:3px"><span style="font-family:var(--font-mono);font-size:14px;color:var(--text-primary)">400ms</span><span class="vl">--dur-slower</span><span class="vl" style="color:var(--text-tertiary)">Route change</span></div>
</div>
<div class="r" style="gap:22px">
<div class="c" style="gap:3px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">--ease-out</span><span class="vl">cubic-bezier(.2,.8,.3,1)</span><span class="vl" style="color:var(--text-tertiary)">Default — everything entering</span></div><div class="c" style="gap:3px"><span style="font-size:12px;font-weight:600;color:var(--text-primary)">--ease-snap</span><span class="vl">cubic-bezier(.3,1.3,.6,1)</span><span class="vl" style="color:var(--text-tertiary)">Switch knob only</span></div>
</div></div>
</body></html>
