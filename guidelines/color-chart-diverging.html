<!-- @dsCard group="Colors" viewport="700x120" name="Chart — diverging" subtitle="Signed values: red negative → neutral → blue positive" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:6px"><div class="sw"><div class="chip" style="height:44px;background:var(--div-neg-4)"></div><div class="nm">neg-4</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-neg-3)"></div><div class="nm">neg-3</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-neg-2)"></div><div class="nm">neg-2</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-neg-1)"></div><div class="nm">neg-1</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-mid)"></div><div class="nm">mid</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-pos-1)"></div><div class="nm">pos-1</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-pos-2)"></div><div class="nm">pos-2</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-pos-3)"></div><div class="nm">pos-3</div></div><div class="sw"><div class="chip" style="height:44px;background:var(--div-pos-4)"></div><div class="nm">pos-4</div></div></div>
</body></html>
