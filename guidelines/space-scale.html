<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="2px base. --space-4 (8px) is the default gap inside controls" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:14px;align-items:flex-end">
<div class="c" style="gap:5px;align-items:center"><div style="width:2px;height:2px;background:var(--blue-700);border-radius:1px"></div><span class="vl">2</span><span class="vl" style="color:var(--text-tertiary)">1</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:4px;height:4px;background:var(--blue-700);border-radius:1px"></div><span class="vl">4</span><span class="vl" style="color:var(--text-tertiary)">2</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:6px;height:6px;background:var(--blue-700);border-radius:1px"></div><span class="vl">6</span><span class="vl" style="color:var(--text-tertiary)">3</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:8px;height:8px;background:var(--blue-700);border-radius:1px"></div><span class="vl">8</span><span class="vl" style="color:var(--text-tertiary)">4</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:10px;height:10px;background:var(--blue-700);border-radius:1px"></div><span class="vl">10</span><span class="vl" style="color:var(--text-tertiary)">5</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:12px;height:12px;background:var(--blue-700);border-radius:1px"></div><span class="vl">12</span><span class="vl" style="color:var(--text-tertiary)">6</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:14px;height:14px;background:var(--blue-700);border-radius:1px"></div><span class="vl">14</span><span class="vl" style="color:var(--text-tertiary)">7</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:16px;height:16px;background:var(--blue-700);border-radius:1px"></div><span class="vl">16</span><span class="vl" style="color:var(--text-tertiary)">8</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:20px;height:20px;background:var(--blue-700);border-radius:1px"></div><span class="vl">20</span><span class="vl" style="color:var(--text-tertiary)">9</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:24px;height:24px;background:var(--blue-700);border-radius:1px"></div><span class="vl">24</span><span class="vl" style="color:var(--text-tertiary)">10</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:32px;height:32px;background:var(--blue-700);border-radius:1px"></div><span class="vl">32</span><span class="vl" style="color:var(--text-tertiary)">11</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:40px;height:40px;background:var(--blue-700);border-radius:1px"></div><span class="vl">40</span><span class="vl" style="color:var(--text-tertiary)">12</span></div><div class="c" style="gap:5px;align-items:center"><div style="width:48px;height:48px;background:var(--blue-700);border-radius:1px"></div><span class="vl">48</span><span class="vl" style="color:var(--text-tertiary)">13</span></div>
</div>
</body></html>
