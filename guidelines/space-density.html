<!-- @dsCard group="Spacing" viewport="700x160" name="Density in use" subtitle="30px table rows, 26px dense — the compactness contract" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:18px">
<div class="sw"><div class="lb" style="margin-bottom:6px">Default 30px</div><div style="border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden">
<div style="display:flex;height:34px;align-items:center;padding:0 12px;background:var(--surface-table-head);border-bottom:1px solid var(--border-default);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)">Sleeve<span style="margin-left:auto">% NAV</span></div>
<div style="display:flex;height:30px;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-body)">Stat arb<span style="margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums">14.1%</span></div><div style="display:flex;height:30px;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-body)">Momentum<span style="margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums">12.6%</span></div><div style="display:flex;height:30px;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-body)">Vol carry<span style="margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums">11.5%</span></div>
</div></div><div class="sw"><div class="lb" style="margin-bottom:6px">Dense 26px</div><div style="border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden">
<div style="display:flex;height:34px;align-items:center;padding:0 12px;background:var(--surface-table-head);border-bottom:1px solid var(--border-default);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)">Sleeve<span style="margin-left:auto">% NAV</span></div>
<div style="display:flex;height:26px;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-body)">Stat arb<span style="margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums">14.1%</span></div><div style="display:flex;height:26px;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-body)">Momentum<span style="margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums">12.6%</span></div><div style="display:flex;height:26px;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-body)">Vol carry<span style="margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums">11.5%</span></div>
</div></div>
</div>
</body></html>
