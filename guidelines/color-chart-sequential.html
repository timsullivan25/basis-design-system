<!-- @dsCard group="Colors" viewport="700x150" name="Chart — sequential" subtitle="Single-series intensity: blue and sky ramps, 8 steps" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="c" style="gap:10px">
<div><div class="r" style="gap:6px"><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-1)"></div><div class="nm">1</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-2)"></div><div class="nm">2</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-3)"></div><div class="nm">3</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-4)"></div><div class="nm">4</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-5)"></div><div class="nm">5</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-6)"></div><div class="nm">6</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-7)"></div><div class="nm">7</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-blue-8)"></div><div class="nm">8</div></div></div></div>
<div><div class="r" style="gap:6px"><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-1)"></div><div class="nm">1</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-2)"></div><div class="nm">2</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-3)"></div><div class="nm">3</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-4)"></div><div class="nm">4</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-5)"></div><div class="nm">5</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-6)"></div><div class="nm">6</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-7)"></div><div class="nm">7</div></div><div class="sw"><div class="chip" style="height:30px;background:var(--seq-sky-8)"></div><div class="nm">8</div></div></div></div></div>
</body></html>
