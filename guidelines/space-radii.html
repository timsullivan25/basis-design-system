<!-- @dsCard group="Spacing" viewport="700x130" name="Corner radii" subtitle="2 / 3 / 5 / 8 / 12 / pill — 5px is the card and control default" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.r{display:flex;flex-wrap:wrap}.c{display:flex;flex-direction:column}
.sw{display:flex;flex-direction:column;gap:0;flex:1 1 0;min-width:0}
.chip{height:46px;border-radius:var(--radius-sm)}
.nm{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{font-family:var(--font-mono);font-size:9px;color:var(--text-disabled)}
.lb{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head><body>
<div class="r" style="gap:16px;align-items:flex-end">
<div class="c" style="gap:6px;align-items:center"><div style="width:56px;height:44px;background:var(--ink-100);border:1px solid var(--border-default);border-radius:2px"></div><span class="vl">2px</span><span class="vl" style="color:var(--text-tertiary)">--radius-xs</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:56px;height:44px;background:var(--ink-100);border:1px solid var(--border-default);border-radius:3px"></div><span class="vl">3px</span><span class="vl" style="color:var(--text-tertiary)">--radius-sm</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:56px;height:44px;background:var(--ink-100);border:1px solid var(--border-default);border-radius:5px"></div><span class="vl">5px</span><span class="vl" style="color:var(--text-tertiary)">--radius-md</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:56px;height:44px;background:var(--ink-100);border:1px solid var(--border-default);border-radius:8px"></div><span class="vl">8px</span><span class="vl" style="color:var(--text-tertiary)">--radius-lg</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:56px;height:44px;background:var(--ink-100);border:1px solid var(--border-default);border-radius:12px"></div><span class="vl">12px</span><span class="vl" style="color:var(--text-tertiary)">--radius-xl</span></div><div class="c" style="gap:6px;align-items:center"><div style="width:56px;height:44px;background:var(--ink-100);border:1px solid var(--border-default);border-radius:999px"></div><span class="vl">pill</span><span class="vl" style="color:var(--text-tertiary)">--radius-pill</span></div>
</div>
</body></html>
